# Risk policy read by the software factory from the default branch only.
# See docs/operations.md in roboco-io/the-software-factory-demo.
requiredChecks:
  - test

# A change merges without an operator approval when the second AI engine approves it
# and the required checks pass. T3 still waits for a person: the factory never merges
# it automatically, whatever this list says.
autoMergeTiers: [T0, T1, T2]

rules:
  - tier: T0
    patterns:
      - "docs/**"
      - "*.md"
  - tier: T3
    patterns:
      - "package.json"
